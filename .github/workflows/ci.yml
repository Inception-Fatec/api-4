name: Main CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  front-end:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: front-end
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: front-end/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm run lint
      - name: Check formatting
        run: pnpm exec prettier --check .
      - name: Run tests
        run: pnpm test

  data-processor:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tecsus-data-processor
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.3.0

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: tecsus-data-processor/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build
      - name: Lint
        run: pnpm run lint

  mqtt-subscriber:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tecsus-mqtt-subscriber
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: tecsus-mqtt-subscriber/package-lock.json

      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  mqtt-publisher:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tecsus-mqtt-publisher
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install required libraries
        run: |
          arduino-cli lib install "PubSubClient"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "DHT sensor library"
          arduino-cli lib install "Adafruit Unified Sensor"

      - name: Copy config.example.h to config.h
        run: cp config.example.h config.h
      - name: Compile sketch
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir /tmp/build .

  back-end:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: back-end
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6.3.0
        with:
          node-version: "24.x"
          cache: "pnpm"
          cache-dependency-path: back-end/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        run: pnpm exec eslint . --ext .js,.ts,.json

      - name: Prettify code
        run: pnpm exec prettier --write .
